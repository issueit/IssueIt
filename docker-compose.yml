# Issueit: one app container plus PostgreSQL. Settings come from .env (see .env.example).
name: issueit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: issueit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: issueit
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueit -d issueit"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: issueit:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://issueit:${POSTGRES_PASSWORD}@db:5432/issueit
    ports:
      - "${ISSUEIT_BIND:-0.0.0.0}:${ISSUEIT_PORT:-8380}:8380"
    volumes:
      - data:/data

  # Public HTTPS without opening a port, for people who'd rather not expose
  # one. Only starts with --profile tunnel. Point the tunnel's public
  # hostname at http://app:8380, and set APP_URL and TRUST_PROXY to match.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # Empty default on purpose: compose reads this even when the profile is off.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db:
  data:
